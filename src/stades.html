.stadium-card:hover {

}
.card-img-top {
  height: 220px;

}
.dark-mode .card-img-top {

}
.stadium-title {

}
.btn-primary {
  background: linear-gradient(90deg, #1e3c72 0%, #2a5298 100%);

}
.btn-primary:hover {

}
.dark-mode .btn-primary {

}
.modal-content {

}
.dark-mode .modal-content {

}
.modal-title {
  color: #1e3c72;
  font-weight: bold;
}
.dark-mode .modal-title {

}
@media (max-width: 767px) {
  .card-img-top {

  }
  .hero-section {

  }
}
.dark-mode .navbar,

}
.dark-mode .card {
  background: #232526;
  color: #f1f1f1;
  border-color: #333;
}
.dark-mode .btn-outline-secondary,

  color: #fff;
  border-color: #888;
}
.dark-mode .btn-outline-secondary:hover,
.dark-mode .btn-outline-primary:hover {

.dark-mode input,

  background: #232526;
  color: #f1f1f1;
  border-color: #333;
}
.dark-mode #map {
  filter: grayscale(0.2) brightness(0.7);
}
:root {
    --primary-red: #CE1126;
    --primary-black: #000000;
    --primary-white: #FFFFFF;

@media (max-width: 991px) {

<!-- Bouton mode sombre global -->
<button class="darkmode-toggle" id="darkmodeToggle">
  <i class="fas fa-moon"></i> <span id="darkmodeText">Mode sombre</span>
</button>
<script>
// Mode sombre global
function setDarkMode(on) {
  document.body.classList.toggle('dark-mode', on);
  localStorage.setItem('darkMode', on ? '1' : '0');
  document.getElementById('darkmodeText').textContent = on ? 'Mode clair' : 'Mode sombre';
  document.querySelector('.darkmode-toggle i').className = on ? 'fas fa-sun' : 'fas fa-moon';
}
const darkBtn = document.getElementById('darkmodeToggle');
darkBtn.addEventListener('click', function() {
  setDarkMode(!document.body.classList.contains('dark-mode'));
});
// Init au chargement
if (localStorage.getItem('darkMode') === '1') setDarkMode(true);
</script>
