        // Fonction pour formater la date en anglais style "Mon 12th May"
        function formatDate(dateStr) {
            if (!dateStr) return "";
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            const [day, month, year] = dateStr.split("/");
            const d = new Date(`${year}-${month}-${day}`);
            const dayNum = d.getDate();
            const daySuffix = (n) => n === 1 ? "st" : n === 2 ? "nd" : n === 3 ? "rd" : "th";
            return `${days[d.getDay()]} ${dayNum}${daySuffix(dayNum)} ${months[d.getMonth()]}`;
        }

        function renderMatchs(list = matchs) {
            const container = document.getElementById('matchs-container');
            container.innerHTML = "";
            list.forEach(match => {
                let dateAffiche = formatDate(match.date);
                let heureAffiche = match.heure || "";
                container.innerHTML += `
                <div class="col-md-6">
                    <!-- Barre date/heure style CAF -->
                    <div class="match-date-bar mb-0">
                        <span class="date">${dateAffiche}</span>
                        <span class="heure">${heureAffiche}</span>
                    </div>
                    <div class="card match-card shadow-sm">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <div class="text-center">
                                    <img src="${match.equipe1.drapeau}" alt="${match.equipe1.nom}" class="flag mb-1">
                                    <div>${match.equipe1.nom}</div>
                                    <div class="pourcentage">${match.equipe1.pourcentage}%</div>
                                </div>
                                <div class="fw-bold fs-4">VS</div>
                                <div class="text-center">
                                    <img src="${match.equipe2.drapeau}" alt="${match.equipe2.nom}" class="flag mb-1">
                                    <div>${match.equipe2.nom}</div>
                                    <div class="pourcentage">${match.equipe2.pourcentage}%</div>
                                </div>
                            </div>
                            <div class="mb-2">
                                <span class="badge bg-primary">Date : ${match.date}</span>
                                <span class="badge bg-secondary">Lieu : ${match.lieu}</span>
                            </div>
                            <div class="mb-2">
                                <a href="${match.live}" class="btn btn-danger btn-sm me-2" target="_blank">Live</a>
                                <a href="${match.recap}" class="btn btn-success btn-sm" target="_blank">Vidéo Récap</a>
                            </div>
                            <div class="mb-2">
                                <strong>Arbitres :</strong>
                                ${match.arbitres.map(arbitre => `
                                    <span class="d-inline-flex align-items-center me-2">
                                        <img src="${arbitre.image}" class="arbitre-img" alt="${arbitre.nom}">
                                        <span>${arbitre.nom}</span>
                                    </span>
                                `).join('')}
                            </div>
                            <div class="mt-3">
                                <h5>${match.article.titre}</h5>

        function searchMatch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = matchs.filter(match =>
                match.equipe1.nom.toLowerCase().includes(query) ||
                match.equipe2.nom.toLowerCase().includes(query) ||
                (match.article && match.article.titre.toLowerCase().includes(query))
            );
            renderMatchs(filtered);
        }
