        const col = document.createElement('div');

        const flipCard = document.createElement('div');
        flipCard.className = 'flip-card';
        flipCard.tabIndex = 0; // Pour l'accessibilité

        // Conteneur interne pour l'effet de retournement
        const flipInner = document.createElement('div');
        flipInner.className = 'flip-card-inner';

        // Face avant de la carte
        const front = document.createElement('div');
        front.className = 'flip-card-front';
        // Contenu HTML de la face avant (drapeau et nom de l'équipe)
        front.innerHTML = `
            ${team.flagImg ? `<img class='team-flag-img' src='../assets/${team.flagImg}' alt='Drapeau ${team.name}'>` : `<div class='team-flag'>${team.flag}</div>`}
            <div class='team-name'>${team.name}</div>
            <div class='badge-pays'>${team.name}</div>
        `;

        // Face arrière de la carte
        const back = document.createElement('div');
        back.className = 'flip-card-back';
        // Contenu HTML de la face arrière (photo équipe, entraîneur et bouton)
        back.innerHTML = `
            ${team.teamImg ? `<img class='team-img' src='../assets/${team.teamImg}' alt='Equipe ${team.name}'>` : ''}
            <div class='coach-block'>
                ${team.coachImg ? `<img class='coach-img' src='../assets/${team.coachImg}' alt='Coach ${team.coach}'>` : ''}
                <div><strong>Sélectionneur :</strong> ${team.coach ? team.coach : '-'}</div>
            </div>
            <button class='see-squad-btn' onclick='event.stopPropagation();showTeamModal(teams[${idx}])'>Voir effectif</button>
        `;

        // Assemblage des éléments
        flipInner.appendChild(front);
        flipInner.appendChild(back);
        flipCard.appendChild(flipInner);
        col.appendChild(flipCard);
        teamsGrid.appendChild(col);
    });

    // Fonction pour afficher le modal avec les joueurs d'une équipe
    function showTeamModal(team) {
        // Récupération des éléments du DOM
        const modalLabel = document.getElementById('playersModalLabel');
        const modalBody = document.getElementById('playersModalBody');

        // Mise à jour du titre du modal avec le drapeau et le nom de l'équipe
        modalLabel.textContent = team.flag + ' ' + team.name;

        // Construction du contenu HTML du modal
        let html = '';
        let teamImgSrc = team.teamImg ? `../assets/${team.teamImg}` : '';
        let coachImgSrc = team.coachImg ? `../assets/${team.coachImg}` : '';

        // Ajout de l'image de l'équipe si disponible
        if (teamImgSrc) {
            html += `<img class='team-img' src='${teamImgSrc}' alt='Photo équipe ${team.name}'>`;
        }

        // Ajout des informations sur l'entraîneur
        if (coachImgSrc || team.coach) {
            html += `<div class='coach-block'>`;
            if (coachImgSrc) {
                html += `<img class='coach-img' src='${coachImgSrc}' alt='Coach ${team.coach}'>`;
            }
            if (team.coach) {
                html += `<div><strong>Sélectionneur :</strong> ${team.coach}</div>`;
            }
            html += `</div>`;
        }

        // Ajout de la liste des joueurs si disponible
        if (team.players) {
            // Pour chaque catégorie de joueurs (gardiens, défenseurs...)
            for (const [role, players] of Object.entries(team.players)) {
                html += `<div class='player-role mt-3 mb-1'>${role}</div><ul class='player-list'>`;
                // Pour chaque joueur dans la catégorie
                players.forEach(p => {
                    html += `<li><span>${p.name}</span> <span class='player-club'>(${p.club})</span></li>`;
                });
                html += '</ul>';
            }
            modalBody.innerHTML = html;
        } else {
            // Message si l'effectif n'est pas disponible
            html += `<div class='text-center py-4'><i class='fas fa-users fa-2x mb-3 text-secondary'></i><br><strong>Effectif à venir</strong></div>`;
            modalBody.innerHTML = html;
        }

        // Affichage du modal avec Bootstrap
        const modal = new bootstrap.Modal(document.getElementById('playersModal'));
        modal.show();
    }
