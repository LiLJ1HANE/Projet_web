    <style>
        .quiz-banner {
            width: 100vw;
            max-width: 100%;
            height: 50vh;
            object-fit: cover;
            display: block;
            margin: 0 auto;
            filter: blur(2px) brightness(0.7);
            transition: transform 0.7s cubic-bezier(.23,1.01,.32,1);
            transform: scale(1.08);
            animation: bannerFloat 20s infinite alternate ease-in-out;
        }

        @keyframes bannerFloat {
            0% { transform: scale(1.08) translateY(0); }
            100% { transform: scale(1.12) translateY(-10px); }
        }

        .quiz-header h2 {
            position: absolute;
            top: 30vh;
            left: 0; right: 0;
            text-align: center;
            color: #fff;
            font-size: 2.7rem;
            text-shadow: 0 4px 24px #000, 0 1px 0 #fff2;
            font-family: 'Russo One', Arial, sans-serif;
            letter-spacing: 2px;
            z-index: 2;
            animation: titleGlow 2s infinite alternate;
        }

        @keyframes titleGlow {
            0% { text-shadow: 0 4px 24px #000, 0 1px 0 #fff2; }
            100% { text-shadow: 0 4px 32px #000, 0 1px 0 #fff4, 0 0 20px rgba(255,255,255,0.2); }
        }

        .result-card-wow {
            background: rgba(255,255,255,0.95);
            box-shadow: 0 8px 32px rgba(31,38,135,0.2);
            backdrop-filter: blur(8px);
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.3);
            max-width: 420px;
            margin: 40px auto;
            padding: 2.5rem;
            text-align: center;
            position: relative;
            animation: cardPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes cardPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .result-emoji {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: emojiBounce 1s infinite alternate;
        }

        @keyframes emojiBounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }

        .score-animated {
            font-size: 3rem;
            font-family: 'Russo One', Arial, sans-serif;
            background: linear-gradient(45deg, #7FB069, #E63946);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 1rem 0;
            text-shadow: 0 2px 10px rgba(127,176,105,0.3);
        }

        .share-btns {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .share-btns button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .share-btns button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-wow-restart {
            background: linear-gradient(45deg, #7FB069, #E63946);
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            padding: 1rem 2.5rem;
            margin-top: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(127,176,105,0.3);
        }

        .btn-wow-restart:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px rgba(127,176,105,0.4);
        }

        .question {
            animation: fadeInUp 0.7s;
            background: rgba(255,255,255,0.9);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(31,38,135,0.1);
            margin-bottom: 1.5rem;
            transform-origin: center;
            transition: transform 0.3s ease;
        }

        .question:hover {
            transform: scale(1.02);
        }

        .answers label {
            display: block;
            padding: 1rem;
            margin: 0.5rem 0;
            border-radius: 10px;
            background: rgba(255,255,255,0.8);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .answers label:hover {
            background: rgba(255,255,255,0.95);
            transform: translateX(10px);
            border-color: #7FB069;
        }

        .answers input[type="radio"]:checked + label {
            background: linear-gradient(45deg, #7FB069, #E63946);
            color: white;
            transform: translateX(15px);
            box-shadow: 0 4px 15px rgba(127,176,105,0.3);
        }

        .progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            z-index: 1000;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #7FB069, #E63946);
            width: 0%;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px rgba(127,176,105,0.5);
        }

        .question-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
            gap: 1rem;
        }

        .question-nav button {
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(45deg, #7FB069, #E63946);
            color: white;
            box-shadow: 0 4px 15px rgba(127,176,105,0.3);
        }

        .question-nav button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(127,176,105,0.4);
        }

        .question-nav button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="progress-container">

    <div class="quiz-header">
        <img src="../assets/image.png" class="quiz-banner">
        <h2>Quiz sur la Coupe d'Afrique des Nations</h2>
    </div>

    <div id="resultArea" style="display:none; text-align:center; margin-bottom:30px;">
        <div class="result-card-wow" id="resultCardWow" style="display:none;">
            <div class="result-emoji" id="resultEmoji"></div>
            <div class="score-animated" id="scoreAnimated"></div>
            <div id="resultMessage"></div>
            <div class="share-btns">
                <button onclick="shareFB()"><i class="fab fa-facebook-f"></i> Partager</button>
                <button class="twitter" onclick="shareTwitter()"><i class="fab fa-twitter"></i> Tweeter</button>
            </div>
            <button id="restartBtn" class="btn-wow-restart">Recommencer</button>
        </div>
    </div>

    <div class="quiz-container">
        <div id="quiz"></div>
        <div class="question-nav">
            <button id="prevBtn">Précédent</button>
            <button id="nextBtn">Suivant</button>
            <button id="submit" style="display:none;">Voir les résultats</button>
        </div>
    </div>
    
    <div class="result-popup" id="resultPopup">
        ...
    </div>

    <script>
        const quizData = [
            {
                question: "Quel pays a remporté le plus de titres de la CAN?",
                answers: {
                    a: "Égypte",
                    b: "Cameroun",
                    c: "Ghana",
                    d: "Nigeria"
                },
                correctAnswer: "a"
            },
            {
                question: "En quelle année a eu lieu la première CAN?",
                answers: {
                    a: "1957",
                    b: "1962",
                    c: "1970",
                    d: "1980"
                },
                correctAnswer: "a"
            },
            {
                question: "Quel joueur marocain détient le record de participations à la CAN?",
                answers: {
                    a: "Mustafa Hadji",
                    b: "Noureddine Naybet",
                    c: "Medhi Benatia",
                    d: "Hakim Ziyech"
                },
                correctAnswer: "b"
            },
            {
                question: "Où s'est déroulée la CAN 2022?",
                answers: {
                    a: "Maroc",
                    b: "Égypte",
                    c: "Cameroun",
                    d: "Sénégal"
                },
                correctAnswer: "c"
            },
            {
                question: "Quel pays a remporté la CAN 2022?",
                answers: {
                    a: "Sénégal",
                    b: "Égypte",
                    c: "Algérie",
                    d: "Maroc"
                },
                correctAnswer: "a"
            },
            {
                question: "Qui était le meilleur buteur de la CAN 2022?",
                answers: {
                    a: "Sadio Mané",
                    b: "Vincent Aboubakar",
                    c: "Mohamed Salah",
                    d: "Riyad Mahrez"
                },
                correctAnswer: "b"
            },
            {
                question: "Combien de fois le Maroc a-t-il remporté la CAN?",
                answers: {
                    a: "0",
                    b: "1",
                    c: "2",
                    d: "3"
                },
                correctAnswer: "b"
            },
            {
                question: "Quelle équipe a été finaliste de la CAN 2022?",
                answers: {
                    a: "Sénégal",
                    b: "Égypte",
                    c: "Cameroun",
                    d: "Maroc"
                },
                correctAnswer: "b"
            },
            {
                question: "En quelle année le Maroc a-t-il remporté la CAN?",
                answers: {
                    a: "1972",
                    b: "1976",
                    c: "1980",
                    d: "1986"
                },
                correctAnswer: "b"
            },
            {
                question: "Quelle ville marocaine a accueilli des matchs de la CAN?",
                answers: {
                    a: "Casablanca",
                    b: "Marrakech",
                    c: "Tanger",
                    d: "Toutes ces réponses"
                },
                correctAnswer: "d"
            }
        ];

        let currentQuestion = 0;
        let userAnswers = new Array(quizData.length);

        function buildQuiz() {
            showQuestion(currentQuestion);
            updateNavButtons();
        }

        function showQuestion(index) {
            const quizContainer = document.getElementById('quiz');
            const q = quizData[index];
            const answers = [];
            for (const letter in q.answers) {
                answers.push(
                    `<label>
                        <input type="radio" name="question${index}" value="${letter}" ${userAnswers[index] === letter ? 'checked' : ''}>
                        <span>${letter.toUpperCase()}) ${q.answers[letter]}</span>
                    </label>`
                );
            }
            quizContainer.innerHTML = `
                <div class="question">
                    <h3>${index + 1}. ${q.question}</h3>
                    <div class="answers">${answers.join('')}</div>
                </div>
            `;
            highlightSelectedLabels();
            attachProgressBarListeners();
        }

        function updateNavButtons() {
            document.getElementById('prevBtn').disabled = currentQuestion === 0;
            document.getElementById('nextBtn').style.display = currentQuestion === quizData.length - 1 ? 'none' : '';
            document.getElementById('submit').style.display = currentQuestion === quizData.length - 1 ? '' : 'none';
        }

        // Navigation events
        document.getElementById('prevBtn').onclick = function() {
            saveAnswer();
            if (currentQuestion > 0) {
                currentQuestion--;
                showQuestion(currentQuestion);
                updateNavButtons();
            }
        };
        document.getElementById('nextBtn').onclick = function() {
            saveAnswer();
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                showQuestion(currentQuestion);
                updateNavButtons();
            }
        };
        document.getElementById('submit').onclick = function() {
            saveAnswer();
            showResults();
        };

        document.getElementById('restartBtn').onclick = function() {
            // Réinitialise les réponses et l'affichage
            userAnswers = new Array(quizData.length);
            currentQuestion = 0;
            document.getElementById('resultArea').style.display = 'none';
            document.getElementById('restartBtn').style.display = 'none';
            document.getElementById('prevBtn').style.display = '';
            document.getElementById('nextBtn').style.display = '';
            document.getElementById('submit').style.display = 'none';
            document.getElementById('progressBar').style.width = '0%';
            buildQuiz();
        };

        function saveAnswer() {
            const selected = document.querySelector('.answers input[type="radio"]:checked');
            userAnswers[currentQuestion] = selected ? selected.value : undefined;
            // Update progress bar
            const answered = userAnswers.filter(a => a !== undefined).length;
            const progress = (answered / quizData.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        // Update highlightSelectedLabels to work for single question
        function highlightSelectedLabels() {
            document.querySelectorAll('.answers input[type="radio"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    const labels = this.closest('.answers').querySelectorAll('label');
                    labels.forEach(l => l.classList.remove('selected-answer'));
                    this.parentElement.classList.add('selected-answer');
                    saveAnswer();
                });
            });
        }

        // Update attachProgressBarListeners to work for single question
        function attachProgressBarListeners() {
            // Already handled in saveAnswer for this mode
        }

        // Modify showResults to use userAnswers
        function showResults() {
            let numCorrect = 0;
            quizData.forEach((q, i) => {
                if (userAnswers[i] === q.correctAnswer) numCorrect++;
            });
            // Affiche le bloc résultat wow
            document.getElementById('quiz').style.display = 'none';
            document.querySelector('.question-nav').style.display = 'none';
            document.getElementById('resultArea').style.display = 'block';
            showResult(numCorrect, quizData.length);
        }

        function shareOnFacebook() {
            const url = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}`;
            window.open(url, '_blank');
        }
        function shareOnTwitter() {
            // Optionally, you can include the score in the tweet
            const scoreText = document.getElementById('resultScore').innerText || '';
            const tweet = `J'ai participé au Quiz CAN ! ${scoreText} #QuizCAN`;
            const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(tweet)}&url=${encodeURIComponent(window.location.href)}`;
            window.open(url, '_blank');
        }

        // Close popup
        document.getElementById('closePopup').addEventListener('click', function() {
            document.getElementById('resultPopup').style.display = 'none';
        });

        // Appel initial
        buildQuiz();

        function showResult(score, total) {
            let emoji = '😅';
            let message = '';
            let confettiColor = '#E63946';

            if (score === total) {
                emoji = '🏆';
                message = "Incroyable ! Tu es un(e) expert(e) de la CAN !";
                confettiColor = '#FFD700';
            } else if (score >= total * 0.7) {
                emoji = '🎉';
                message = "Bravo ! Tu connais très bien la CAN.";
                confettiColor = '#7FB069';
            } else if (score >= total * 0.5) {
                emoji = '😎';
                message = "Pas mal ! Continue à apprendre sur la CAN.";
            } else {
                emoji = '😢';
                message = "Continue à apprendre ! La prochaine fois sera la bonne.";
            }

            document.getElementById('resultEmoji').textContent = emoji;
            
            let current = 0;
            const scoreEl = document.getElementById('scoreAnimated');
            scoreEl.textContent = '0 / ' + total;
            
            const interval = setInterval(() => {
                if (current < score) {
                    current++;
                    scoreEl.textContent = current + ' / ' + total;
                } else {
                    clearInterval(interval);
                    if (score >= total * 0.7) {
                        confetti({
                            particleCount: 150,
                            spread: 90,
                            origin: { y: 0.6 },
                            colors: [confettiColor, '#FFFFFF', '#7FB069', '#E63946']
                        });
                    }
                }
            }, 50);

            document.getElementById('resultMessage').innerHTML = message;
            document.getElementById('resultCardWow').style.display = '';
        }

        // Partage réseaux sociaux
        function shareFB() {
            const url = encodeURIComponent(window.location.href);
            const txt = encodeURIComponent("J'ai testé mes connaissances sur la CAN !");
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}&quote=${txt}`,'_blank');
        }
        function shareTwitter() {
            const url = encodeURIComponent(window.location.href);
            const txt = encodeURIComponent("J'ai testé mes connaissances sur la CAN !");
            window.open(`https://twitter.com/intent/tweet?url=${url}&text=${txt}`,'_blank');
        }
    </script>
</body>
